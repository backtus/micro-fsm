quarkus.application.name=micro-fsm
quarkus.lambda.handler=quarkus-lambda-http

# Database: PostgreSQL everywhere; %dsql switches to Aurora DSQL (see below).
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# Migrations: se.microfsm.Migrator (not Flyway, see docs/DECISIONS.md). Deployed environments run it via a
# separate one-off invoke, never at startup; dev/test migrate on boot.
app.migrate.at-start=false
# `${index_async}` placeholder in migrations is empty by default; ASYNC on DSQL (see %dsql).

# dev/test: local Postgres via Dev Services, REPEATABLE READ like DSQL
%dev.app.migrate.at-start=true
%test.app.migrate.at-start=true
%test.quarkus.datasource.jdbc.transaction-isolation-level=repeatable-read
%dev.quarkus.datasource.jdbc.transaction-isolation-level=repeatable-read

# %dsql: Aurora DSQL with IAM auth (no password). Set at deploy time:
#   QUARKUS_DATASOURCE_JDBC_URL=jdbc:aws-dsql:postgresql://<cluster>.dsql.eu-north-1.on.aws/postgres
# The driver is a build-time property, so the package must be built with -Dquarkus.profile=dsql.
%dsql.quarkus.datasource.jdbc.driver=software.amazon.dsql.jdbc.DSQLConnector
%dsql.quarkus.datasource.username=admin
%dsql.quarkus.datasource.db-version=16.0
%dsql.quarkus.hibernate-orm.database.version-check.enabled=false
%dsql.quarkus.hibernate-orm.database.start-offline=true
%dsql.quarkus.datasource.jdbc.url=jdbc:aws-dsql:postgresql://localhost.invalid/postgres
%dsql.quarkus.datasource.jdbc.initial-size=0
%dsql.quarkus.datasource.jdbc.min-size=0
%dsql.quarkus.datasource.jdbc.max-size=2
%dsql.quarkus.datasource.jdbc.max-lifetime=50M
%dsql.app.migrate.index-async=ASYNC
